<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Hunter World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--glow:#3ad1ff;--line:rgba(47,184,255,.6);--panel:rgba(6,16,34,.78);--text:#d9ecff;--dim:#7d98bd;--good:#3dffb0;--bad:#ff4d6d;--gold:#ffd166;--purple:#b693ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#03050b;color:var(--text);font-family:Rajdhani,system-ui,sans-serif}
canvas{display:block;touch-action:none}
.hud{position:fixed;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 16px rgba(47,184,255,.25);padding:10px 14px;backdrop-filter:blur(6px);z-index:5}
.hud:before{content:"";position:absolute;top:-2px;left:-2px;width:12px;height:12px;border:2px solid var(--glow);border-right:0;border-bottom:0}
.tl{top:12px;left:12px;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 24px)}
.rk{width:46px;height:46px;flex:none;display:grid;place-items:center;transform:rotate(45deg);border:2px solid var(--glow);margin:6px;box-shadow:0 0 14px rgba(58,209,255,.6)}
.rk b{transform:rotate(-45deg);font-family:Orbitron;font-weight:900;font-size:24px;color:#fff;text-shadow:0 0 10px var(--glow)}
.nm{font-family:Orbitron;font-weight:700;font-size:13px;letter-spacing:.1em}
.sub{color:var(--dim);font-size:13px}
.bar{height:6px;width:150px;background:rgba(255,255,255,.08);margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1b7fff,var(--glow));box-shadow:0 0 8px var(--glow)}
.tr{top:12px;right:12px;text-align:right;font-size:14px;line-height:1.5}
.tr b{font-family:Orbitron;font-size:15px}
.bl{bottom:12px;left:12px;font-size:15px;max-width:calc(100vw - 24px)}
.ttl{font-family:Orbitron;font-size:10px;letter-spacing:.3em;color:var(--glow);margin-bottom:4px}
.br{bottom:12px;right:12px;display:flex;gap:8px;padding:6px}
.btn{font-family:Orbitron;font-size:11px;letter-spacing:.15em;color:var(--glow);border:1px solid var(--line);background:rgba(47,184,255,.08);padding:8px 12px;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(47,184,255,.2)}
.mode{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-family:Orbitron;font-size:10px;letter-spacing:.15em;color:var(--gold);
  border:1px solid rgba(255,209,102,.5);padding:5px 10px;background:rgba(20,14,2,.6);z-index:5;white-space:nowrap}
.mode.live{color:var(--good);border-color:rgba(61,255,176,.5);background:rgba(2,20,12,.6)}
@media(max-width:760px){.mode{top:auto;bottom:118px;font-size:9px}.tr{top:84px}.bar{width:110px}}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);min-width:min(340px,90vw);max-width:90vw;padding:18px 20px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.card.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.card h3{font-family:Orbitron;font-size:16px;letter-spacing:.12em;margin-bottom:2px}
.card .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.card .ln{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-bottom:1px dashed rgba(125,152,189,.25);font-size:16px}
.card .x{position:absolute;top:8px;right:12px;cursor:pointer;color:var(--dim);font-size:20px}
.pop{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);padding:18px 26px;text-align:center;opacity:0;transition:.4s;z-index:12;pointer-events:none;min-width:min(480px,90vw)}
.pop.on{opacity:1;transform:translate(-50%,0)}
.pop .ttl{margin-bottom:8px}.pop p{font-size:21px;font-weight:600}
.hint{position:fixed;bottom:64px;right:14px;color:var(--dim);font-size:12px;z-index:4}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:Orbitron;letter-spacing:.4em;color:var(--glow);background:#03050b;z-index:20;transition:opacity .8s}
</style>
</head>
<body>
<div class="loading" id="loading">[ SYSTEM LOADING ]</div>
<div class="mode" id="mode">…</div>
<div class="hud tl">
  <div class="rk"><b id="rank">E</b></div>
  <div><div class="nm" id="hname">HUNTER</div><div class="sub" id="lvl">LV.1</div><div class="bar"><i id="xp" style="width:0"></i></div></div>
</div>
<div class="hud tr">
  <div class="ttl">LOOT</div>
  <div>Payouts <b id="pay" style="color:var(--gold)">$0</b></div>
  <div>Fees <b id="fees">$0</b> • Net <b id="net">$0</b></div>
  <div class="sub">Gates <span id="gc">0</span> cleared • <span id="gd">0</span> dead</div>
</div>
<div class="hud bl">
  <div class="ttl">DAILY QUEST</div>
  <div>Hold the line (&gt; -$<span id="lim">500</span>): <b id="qs">CLEAR</b></div>
  <div>Today <b id="qp">$0</b> • <span id="qt">0</span> closed • <span id="qo">0</span> open</div>
</div>
<div class="hud br"><a class="btn" href="stats.html">STATS</a><span class="btn" id="spin">SPIN: ON</span></div>
<div class="hint">drag to look around • scroll / pinch to zoom • tap a gate or shadow</div>
<div class="hud card" id="card"><span class="x" id="cx">×</span><h3 id="ch"></h3><div class="tag" id="ct"></div><div id="cb"></div></div>
<div class="hud pop" id="pop"><div class="ttl">[ SYSTEM MESSAGE ]</div><p id="popm"></p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const $ = id => document.getElementById(id);
const money = v => (v < 0 ? "-$" : "$") + Math.abs(Math.round(v)).toLocaleString();
const C = {blue:0x3ad1ff, gold:0xffd166, purple:0xa77bff, red:0xff4d6d, stone:0x1a2233, dark:0x0b1020};

// ---------- scene
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050a18, 0.018);
scene.background = new THREE.Color(0x03050b);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 14, 30);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 2, 0); controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 10; controls.maxDistance = 60; controls.autoRotate = true; controls.autoRotateSpeed = 0.5;

scene.add(new THREE.HemisphereLight(0x5a8cff, 0x0a0614, 0.55));
const moon = new THREE.DirectionalLight(0x9fc6ff, 0.6); moon.position.set(-20, 30, 10); scene.add(moon);
const core = new THREE.PointLight(C.blue, 1.4, 40); core.position.set(0, 6, 0); scene.add(core);

// stars
(() => {
  const g = new THREE.BufferGeometry(), n = 1500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const r = 120 + Math.random() * 80, t = Math.random() * Math.PI * 2, u = Math.random() * 0.9 + 0.05;
    p[i*3] = r * Math.cos(t) * Math.sin(u * Math.PI); p[i*3+1] = r * Math.cos(u * Math.PI) * 0.8 + 20; p[i*3+2] = r * Math.sin(t) * Math.sin(u * Math.PI); }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xbfdcff, size:0.6, fog:false})));
})();
// big moon
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(8, 32, 32), new THREE.MeshBasicMaterial({color:0xcfe4ff, fog:false}));
moonMesh.position.set(-70, 55, -110); scene.add(moonMesh);
const halo = new THREE.Mesh(new THREE.SphereGeometry(11, 32, 32), new THREE.MeshBasicMaterial({color:C.blue, transparent:true, opacity:.12, fog:false}));
halo.position.copy(moonMesh.position); scene.add(halo);

// ---------- floating island
const island = new THREE.Group(); scene.add(island);
const stoneMat = new THREE.MeshStandardMaterial({color:C.stone, roughness:.95, flatShading:true});
const slab = new THREE.Mesh(new THREE.CylinderGeometry(16, 13, 2.5, 14, 1), stoneMat); slab.position.y = -1.25; island.add(slab);
const under = new THREE.Mesh(new THREE.ConeGeometry(13, 14, 14, 3), stoneMat); under.rotation.x = Math.PI; under.position.y = -9.5; island.add(under);
const floor = new THREE.Mesh(new THREE.CircleGeometry(15.6, 48), new THREE.MeshStandardMaterial({color:0x10182a, roughness:.8})); floor.rotation.x = -Math.PI/2; floor.position.y = 0.01; island.add(floor);
// rune circles
function ring(r, w, color, op) { const m = new THREE.Mesh(new THREE.RingGeometry(r, r + w, 96), new THREE.MeshBasicMaterial({color, transparent:true, opacity:op, side:THREE.DoubleSide}));
  m.rotation.x = -Math.PI/2; m.position.y = 0.03; island.add(m); return m; }
const runeA = ring(15, .18, C.blue, .8), runeB = ring(5.2, .12, C.blue, .7), runeC = ring(3.6, .06, C.purple, .8);
for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2, s = new THREE.Mesh(new THREE.PlaneGeometry(.5, .9), new THREE.MeshBasicMaterial({color:C.blue, transparent:true, opacity:.7, side:THREE.DoubleSide}));
  s.rotation.x = -Math.PI/2; s.rotation.z = -a; s.position.set(Math.cos(a) * 14.2, .04, Math.sin(a) * 14.2); island.add(s); }
// floating rocks
const rocks = [];
for (let i = 0; i < 14; i++) { const r = new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random() * 1.6 + .5, 0), stoneMat);
  const a = Math.random() * Math.PI * 2, d = 22 + Math.random() * 18; r.position.set(Math.cos(a) * d, Math.random() * 14 - 6, Math.sin(a) * d);
  r.userData = {base:r.position.y, sp:Math.random() * .6 + .2, ph:Math.random() * 6}; scene.add(r); rocks.push(r); }
// mana particles
const motes = (() => { const g = new THREE.BufferGeometry(), n = 260, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, d = Math.random() * 15; p[i*3] = Math.cos(a) * d; p[i*3+1] = Math.random() * 12; p[i*3+2] = Math.sin(a) * d; }
  g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  const m = new THREE.Points(g, new THREE.PointsMaterial({color:C.blue, size:.12, transparent:true, opacity:.8})); scene.add(m); return m; })();

// ---------- text sprites
function label(lines, color = "#d9ecff", scale = 1) {
  const cv = document.createElement("canvas"), x = cv.getContext("2d"); cv.width = 512; cv.height = 128 * lines.length;
  x.textAlign = "center"; x.textBaseline = "middle";
  lines.forEach((t, i) => { x.font = (i ? "600 54px Rajdhani" : "700 58px Orbitron"); x.shadowColor = color; x.shadowBlur = 18; x.fillStyle = i ? "#a9c4e6" : color; x.fillText(t, 256, 64 + i * 118); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  s.scale.set(4.2 * scale, 1.05 * lines.length * scale, 1); return s;
}

// ---------- hunter (center)
const hunter = new THREE.Group(); scene.add(hunter);
const coat = new THREE.MeshStandardMaterial({color:0x0c0f1a, roughness:.6, emissive:0x05101f});
const body = new THREE.Mesh(new THREE.CylinderGeometry(.55, .9, 2.6, 8), coat); body.position.y = 1.3; hunter.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(.45, 16, 16), new THREE.MeshStandardMaterial({color:0xf3e9e0, roughness:.6})); head.position.y = 3.05; hunter.add(head);
const hair = new THREE.Mesh(new THREE.SphereGeometry(.48, 16, 16, 0, Math.PI*2, 0, Math.PI*.55), new THREE.MeshStandardMaterial({color:0x111111})); hair.position.y = 3.12; hunter.add(hair);
[-1, 1].forEach(s => { const e = new THREE.Mesh(new THREE.SphereGeometry(.06, 8, 8), new THREE.MeshBasicMaterial({color:C.blue})); e.position.set(s * .16, 3.08, .4); hunter.add(e); });
const aura = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.8, 4.2, 24, 1, true), new THREE.MeshBasicMaterial({color:C.blue, transparent:true, opacity:.12, side:THREE.DoubleSide, depthWrite:false}));
aura.position.y = 2; hunter.add(aura);
let rankSprite = null;

// ---------- gates + shadows (rebuilt from data)
const gateGroup = new THREE.Group(), shadowGroup = new THREE.Group(); scene.add(gateGroup); scene.add(shadowGroup);
const clickables = [];
function clear(g) { while (g.children.length) g.remove(g.children[0]); }

function makeGate(g, i, n) {
  const step = Math.min(0.85, (Math.PI * 1.5) / Math.max(n - 1, 1)), grp = new THREE.Group(), a = -Math.PI / 2 + (i - (n - 1) / 2) * step, R = 10.5;   // back arc; front stays open for the army
  grp.position.set(Math.cos(a) * R, 0, Math.sin(a) * R); grp.lookAt(0, 0, 0);
  const dead = g.status === "blown", col = dead ? 0x555566 : g.stage === "funded" ? C.gold : C.blue;
  const pm = new THREE.MeshStandardMaterial({color:dead ? 0x22252e : 0x2a3348, roughness:.9, flatShading:true});
  const p1 = new THREE.Mesh(new THREE.BoxGeometry(.7, 5, .7), pm), p2 = p1.clone(), lintel = new THREE.Mesh(new THREE.BoxGeometry(4.6, .7, .9), pm);
  p1.position.set(-1.9, 2.5, 0); p2.position.set(1.9, 2.5, 0); lintel.position.set(0, 5.2, 0);
  if (dead) { p2.rotation.z = 1.35; p2.position.set(2.8, .4, .6); lintel.rotation.z = .5; lintel.position.set(.4, .5, -.8); p1.scale.y = .6; p1.position.y = 1.5; }
  grp.add(p1, p2, lintel);
  const parts = [p1, p2, lintel];
  if (!dead) {
    const portal = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshBasicMaterial({color:col, transparent:true, opacity:.55, side:THREE.DoubleSide}));
    portal.position.set(0, 2.5, 0); portal.scale.y = 1.35; grp.add(portal);
    const swirl = new THREE.Mesh(new THREE.RingGeometry(.4, 1.5, 48, 1, 0, Math.PI * 1.4), new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.25, side:THREE.DoubleSide}));
    swirl.position.set(0, 2.5, .02); swirl.scale.y = 1.35; grp.add(swirl);
    const prog = new THREE.Mesh(new THREE.RingGeometry(1.7, 1.95, 64, 1, Math.PI / 2, -Math.max(.02, g.pct / 100) * Math.PI * 2), new THREE.MeshBasicMaterial({color:col, side:THREE.DoubleSide}));
    prog.position.set(0, 2.5, .03); prog.scale.y = 1.35; grp.add(prog);
    const light = new THREE.PointLight(col, 1.2, 8); light.position.set(0, 2.5, 1); grp.add(light);
    grp.userData.anim = {portal, swirl, light};
    parts.push(portal, swirl, prog);
  }
  const lb = label([g.name, dead ? "DEAD" : g.stage === "funded" ? "CLEARED • FUNDED" : `${Math.round(g.pct)}% to target`], dead ? "#8a8f9e" : g.stage === "funded" ? "#ffd166" : "#3ad1ff", .9);
  lb.position.set(0, 6.6, 0); grp.add(lb);
  parts.forEach(m => { m.userData.info = {kind:"gate", g}; clickables.push(m); });
  gateGroup.add(grp);
}

function makeShadow(s, k) {
  const grp = new THREE.Group(), baseA = Math.PI / 2 + (k - 1) * 0.5, R = 8.6;
  const count = Math.min(5, 1 + Math.floor(s.level / 2));
  const mat = new THREE.MeshStandardMaterial({color:0x140a26, emissive:0x3a1f78, emissiveIntensity:.9, roughness:.4, transparent:true, opacity:.95});
  for (let j = 0; j < count; j++) {
    const f = new THREE.Group(), off = (j - (count - 1) / 2) * 0.9, a = baseA + off * 0.12, rr = R + Math.abs(off) * .5;
    f.position.set(Math.cos(a) * rr, 0, Math.sin(a) * rr);
    const sc = j === Math.floor(count / 2) ? 1.15 : .85;
    let torso;
    if (s.key === "VWAP") torso = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.9, .9), mat);
    else if (s.key === "ASIA") torso = new THREE.Mesh(new THREE.ConeGeometry(.75, 2.2, 6), mat);
    else torso = new THREE.Mesh(new THREE.CylinderGeometry(.35, .6, 2, 6), mat);
    torso.position.y = 1.1;
    const hd = new THREE.Mesh(s.key === "ORB" ? new THREE.ConeGeometry(.33, .8, 6) : new THREE.SphereGeometry(.36, 10, 10), mat); hd.position.y = 2.5;
    [-1, 1].forEach(q => { const e = new THREE.Mesh(new THREE.SphereGeometry(.07, 8, 8), new THREE.MeshBasicMaterial({color:0x7df9ff})); e.position.set(q * .13, 2.5, .3); f.add(e); });
    if (s.key === "ORB") { const sw = new THREE.Mesh(new THREE.BoxGeometry(.1, 2.2, .1), new THREE.MeshBasicMaterial({color:0xb693ff})); sw.position.set(.7, 1.3, .2); sw.rotation.z = .25; f.add(sw); }
    f.add(torso, hd); f.scale.setScalar(sc); f.lookAt(0, 0, 0);
    f.userData.bob = {ph:Math.random() * 6};
    [torso, hd].forEach(m => { m.userData.info = {kind:"shadow", s}; clickables.push(m); });
    grp.add(f);
  }
  const mid = new THREE.Vector3(Math.cos(baseA) * (R + 1.4), 3.7, Math.sin(baseA) * (R + 1.4));
  const lb = label([s.name, `LV.${s.level} • ${s.wins}W ${s.losses}L`], "#c9b3ff", .75); lb.position.copy(mid); grp.add(lb);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.8, 32), new THREE.MeshBasicMaterial({color:C.purple, transparent:true, opacity:.18}));
  glow.rotation.x = -Math.PI/2; glow.position.set(Math.cos(baseA) * R, .05, Math.sin(baseA) * R); grp.add(glow);
  shadowGroup.add(grp);
}

// ---------- data -> world
let last = null;
function build(d) {
  clickables.length = 0; clear(gateGroup); clear(shadowGroup);
  const gates = d.gates.slice(-10);                         // newest 10 gates on the island
  gates.forEach((g, i) => makeGate(g, i, gates.length));
  d.shadows.forEach((s, k) => makeShadow(s, k));
  if (rankSprite) hunter.remove(rankSprite);
  rankSprite = label([`RANK ${d.hunter.rank}`, `LV.${d.hunter.level}`], d.hunter.rank === "S" ? "#ffd166" : "#3ad1ff", 1); rankSprite.position.y = 4.6; hunter.add(rankSprite);
  [body, head, hair].forEach(m => { m.userData.info = {kind:"hunter", d}; clickables.push(m); });
}
function hud(d) {
  const live = d.mode.startsWith("LIVE"); $("mode").textContent = (live ? "● " : "") + d.mode; $("mode").className = "mode" + (live ? " live" : "");
  const h = d.hunter; $("rank").textContent = h.rank; $("hname").textContent = h.name;
  $("lvl").textContent = `LV.${h.level} • ${h.xp - h.xp_lo}/${h.xp_hi - h.xp_lo} XP`; $("xp").style.width = Math.min(100, (h.xp - h.xp_lo) / (h.xp_hi - h.xp_lo) * 100) + "%";
  const l = d.loot; $("pay").textContent = money(l.payouts); $("fees").textContent = money(l.fees);
  $("net").textContent = money(l.net); $("net").style.color = l.net >= 0 ? "var(--good)" : "var(--bad)"; $("gc").textContent = l.passed; $("gd").textContent = l.blown;
  const q = d.quest; $("lim").textContent = q.limit; $("qs").textContent = q.held ? "CLEAR" : "FAILED"; $("qs").style.color = q.held ? "var(--good)" : "var(--bad)";
  $("qp").textContent = money(q.pnl); $("qp").style.color = q.pnl >= 0 ? "var(--good)" : "var(--bad)"; $("qt").textContent = q.trades; $("qo").textContent = q.open;
}
function pop(m) { $("popm").textContent = m; $("pop").classList.add("on"); setTimeout(() => $("pop").classList.remove("on"), 4200); }
function seen(k, v) { try { const o = localStorage.getItem(k); localStorage.setItem(k, v); return o; } catch (e) { return null; } }
async function load() {
  try {
    const d = await (await fetch("data.json?t=" + Date.now())).json();
    const sig = JSON.stringify([d.gates, d.shadows, d.hunter]);
    if (sig !== last) { build(d); last = sig; }
    hud(d);
    const ol = seen("w_lvl", d.hunter.level), op = seen("w_passed", d.loot.passed), ob = seen("w_blown", d.loot.blown);
    if (op !== null && +op < d.loot.passed) pop("Gate cleared. An account is now FUNDED.");
    else if (ol !== null && +ol < d.hunter.level) pop(`LEVEL UP! You are now level ${d.hunter.level}.`);
    else if (ob !== null && +ob < d.loot.blown) pop("A gate collapsed. The System bought a new eval.");
  } catch (e) { $("mode").textContent = "OFFLINE: is the farm running?"; }
  $("loading").style.opacity = 0; setTimeout(() => $("loading").style.display = "none", 900);
}

// ---------- click / tap info cards
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
addEventListener("pointerdown", e => downAt = [e.clientX, e.clientY], true);
renderer.domElement.addEventListener("click", e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, false)[0]; if (!hit) return $("card").classList.remove("on");
  const info = hit.object.userData.info, L = (a, b, c) => `<div class="ln"><span>${a}</span><b style="color:${c || "inherit"}">${b}</b></div>`;
  if (info.kind === "gate") { const g = info.g;
    $("ch").textContent = g.name; $("ct").textContent = g.status === "blown" ? "Collapsed gate (blown eval)" : g.stage === "funded" ? "Cleared gate (funded account)" : "Active dungeon (evaluation)";
    $("cb").innerHTML = L("Lane / risk per trade", `${g.lane} • $${g.risk}`) + L(g.stage === "funded" ? "Payout progress" : "Progress to target", g.goal) +
      (g.status === "blown" ? L("Status", "DEAD", "var(--bad)") : L("Room before death", money(g.room), g.danger > 60 ? "var(--bad)" : "var(--good)"));
  } else if (info.kind === "shadow") { const s = info.s;
    $("ch").textContent = s.name; $("ct").textContent = "Shadow soldier • " + s.cls;
    $("cb").innerHTML = L("Level", s.level) + L("Battles", s.trades) + L("Wins / losses", `${s.wins} / ${s.losses}`) + L("Loot (lane A)", money(s.pnl), s.pnl >= 0 ? "var(--good)" : "var(--bad)");
  } else { const d = info.d, h = d.hunter;
    $("ch").textContent = h.name; $("ct").textContent = `Rank ${h.rank} hunter`;
    $("cb").innerHTML = L("Level", h.level) + L("XP", h.xp) + L("Next rank", h.next_rank ? `${h.next_rank} (${money(h.next_need)} more payouts)` : "MAX") + L("Net loot", money(d.loot.net), d.loot.net >= 0 ? "var(--good)" : "var(--bad)");
  }
  $("card").classList.add("on");
});
$("cx").onclick = () => $("card").classList.remove("on");
$("spin").onclick = () => { controls.autoRotate = !controls.autoRotate; $("spin").textContent = "SPIN: " + (controls.autoRotate ? "ON" : "OFF"); };
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
if (innerWidth < 760) camera.position.set(0, 18, 40);

// ---------- animate
const clock = new THREE.Clock();
(function tick() {
  const t = clock.getElapsedTime();
  runeA.rotation.z = t * .05; runeB.rotation.z = -t * .2; runeC.rotation.z = t * .35;
  aura.material.opacity = .1 + Math.sin(t * 2) * .04; aura.scale.setScalar(1 + Math.sin(t * 2) * .03);
  hunter.position.y = Math.sin(t * 1.2) * .06; core.intensity = 1.2 + Math.sin(t * 1.5) * .3;
  rocks.forEach(r => { r.position.y = r.userData.base + Math.sin(t * r.userData.sp + r.userData.ph) * .8; r.rotation.y += .002; });
  const mp = motes.geometry.attributes.position; for (let i = 0; i < mp.count; i++) { let y = mp.getY(i) + .02; if (y > 12) y = 0; mp.setY(i, y); } mp.needsUpdate = true;
  gateGroup.children.forEach((g, i) => { const a = g.userData.anim; if (!a) return; a.swirl.rotation.z = -t * 1.5 - i; a.portal.material.opacity = .45 + Math.sin(t * 2 + i) * .12; a.light.intensity = 1 + Math.sin(t * 2 + i) * .4; });
  shadowGroup.children.forEach(grp => grp.children.forEach(f => { if (f.userData.bob) f.position.y = Math.sin(t * 1.6 + f.userData.bob.ph) * .08; }));
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(tick);
})();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { load(); setInterval(load, 30000); });
</script>
